[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actualq"
dynamic = ["version"]
description = "Read an Actual Budget export from the command line. No server, no dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["actual", "actualbudget", "budget", "finance", "cli", "sqlite"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
actualq = "actualq:main"

[project.urls]
Homepage = "https://github.com/madhurdeepjain/actualq"

# One source of truth for the version: __version__ in actualq.py. Keeping it in
# two places means shipping a tag whose package says something else.
[tool.hatch.version]
path = "actualq.py"

[tool.hatch.build.targets.wheel]
only-include = ["actualq.py"]

[tool.hatch.build.targets.wheel.sources]
"actualq.py" = "actualq.py"
